experiment_name: 'experiments' # Name of the experiment
experiment_dir: './experiments/'  # Directory to potentially save the model to

seed: 0 # Random seed
workers: 2 # Number of workers for data loading
save_model: False # Whether to save the model. Set to True for inspecting models post training [True, False]
train_only: False # Whether to train the model only and exit before performing interventions [True, False]
intervene_only: False # Whether to skip training/test evaluation and only run interventions [True, False]
intervention_max_batches: null # Optional test-loader batch limit for intervention-only benchmarks.
intervention_log_interval: 10 # Log full intervention metrics every N intervened concepts.
intervention_order: batch_first # Intervention loop order [batch_first, step_first].

logging:
  project: 'SCBM' # Name of the wandb project
  mode: 'disabled' # Whether to log to wandb [online, offline, disabled]
  entity: "your_entity" # Your wandb entity
